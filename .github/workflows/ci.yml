name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NASM
        run: sudo apt update && sudo apt install -y nasm

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Smoke test
        run: |
          mkdir -p www/docs
          echo "ci-hello" > www/hello.txt
          echo "ci-note" > www/docs/note.txt
          ./asmshare &
          server_pid=$!
          sleep 1
          fail=0
          check() {
            if [ "$3" = "$2" ]; then echo "OK   $1"; else echo "FAIL $1 (attendu: $2, obtenu: $3)"; fail=1; fi
          }
          check "GET /hello.txt" "ci-hello" "$(curl -s http://127.0.0.1:8080/hello.txt)"
          check "GET /" "200" "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          check "GET /docs/" "200" "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/)"
          check "GET /docs/note.txt" "ci-note" "$(curl -s http://127.0.0.1:8080/docs/note.txt)"
          check "GET /nope" "404" "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)"
          check "GET /../Makefile" "403" "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/../Makefile)"
          kill $server_pid || true
          exit $fail

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: asmshare
          path: asmshare